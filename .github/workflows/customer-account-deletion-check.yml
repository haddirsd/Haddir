name: Customer account deletion safety check

on:
  push:
    branches:
      - fix/customer-account-deletion-safety
    paths:
      - "supabase/migrations/20261115120000_atomic_customer_account_deletion.sql"
      - "supabase/functions/delete-customer-account/**"
      - "supabase/recovery/test-harness/customer-account-deletion.sql"
      - ".github/workflows/customer-account-deletion-check.yml"

permissions:
  contents: read

jobs:
  postgres-and-deno:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: haddir_deletion_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d haddir_deletion_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Edge Function
        run: deno check --node-modules-dir=auto supabase/functions/delete-customer-account/index.ts
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
      - name: Run PostgreSQL 17 deletion and write-barrier assertions
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: haddir_deletion_test
        run: psql -v ON_ERROR_STOP=1 -f supabase/recovery/test-harness/customer-account-deletion.sql
