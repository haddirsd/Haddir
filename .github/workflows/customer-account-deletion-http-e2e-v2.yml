name: Customer account deletion HTTP E2E v2
on:
  push:
    branches:
      - fix/customer-account-deletion-safety
    paths:
      - ".github/workflows/customer-account-deletion-http-e2e-v2.yml"
      - "supabase/recovery/test-harness/customer-account-deletion-http-e2e-v2.mjs"
permissions:
  contents: read
jobs:
  disposable-supabase-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: https://adbpeojpscwnsombisif.supabase.co
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Run real Auth, Edge Function and Storage deletion flow
        run: node supabase/recovery/test-harness/customer-account-deletion-http-e2e-v2.mjs
