name: Supabase local migration check

on:
  pull_request:
    branches:
      - main
    paths:
      - "supabase/**"
      - "tests/integration/**"
      - "tests/e2e/**"
      - "package.json"
      - "package-lock.json"
      - "app/layout.tsx"
      - "app/HomeClient.tsx"
      - "features/auth/**"
      - "features/customer-account/**"
      - ".github/workflows/supabase-local-migration-check.yml"
  push:
    branches:
      - main
    paths:
      - "supabase/**"
      - "tests/integration/**"
      - "tests/e2e/**"
      - "package.json"
      - "package-lock.json"
      - "app/layout.tsx"
      - "app/HomeClient.tsx"
      - "features/auth/**"
      - "features/customer-account/**"
      - ".github/workflows/supabase-local-migration-check.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-local-migration-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migration-replay:
    name: Replay all migrations on isolated local Supabase
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 3.2.0

      - name: Initialize local Supabase configuration
        run: |
          if [ ! -f supabase/config.toml ]; then
            supabase init
          fi
          supabase --version
          test -f supabase/config.toml

      - name: Start isolated local Supabase stack
        run: supabase start -x studio,imgproxy,logflare,vector

      - name: Verify the complete migration chain
        run: supabase db reset

      - name: Run isolated database integration tests
        run: supabase test db

      - name: Run direct payment receipt Storage integration test
        run: |
          eval "$(supabase status -o env)"
          export SUPABASE_URL="$API_URL"
          export SUPABASE_ANON_KEY="$ANON_KEY"
          export SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          export NEXT_PUBLIC_SUPABASE_URL="$API_URL"
          export NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$ANON_KEY"
          export TEST_BASE_URL="http://127.0.0.1:3000"

          npm run dev -- --hostname 127.0.0.1 --port 3000 > /tmp/haddir-next-dev.log 2>&1 &
          NEXT_SERVER_PID=$!
          trap 'kill "$NEXT_SERVER_PID" 2>/dev/null || true' EXIT

          READY=0
          for attempt in $(seq 1 60); do
            HTTP_STATUS=$(curl --silent --output /dev/null --write-out "%{http_code}" \
              "$TEST_BASE_URL" || true)
            if [ "$HTTP_STATUS" = "200" ]; then
              READY=1
              break
            fi
            if ! kill -0 "$NEXT_SERVER_PID" 2>/dev/null; then
              cat /tmp/haddir-next-dev.log
              exit 1
            fi
            sleep 2
          done

          if [ "$READY" -ne 1 ]; then
            cat /tmp/haddir-next-dev.log
            echo "Next.js server did not become ready."
            exit 1
          fi

          node --experimental-default-type=module --experimental-strip-types tests/integration/receipt-upload.mjs

      - name: Run real Chromium browser UI smoke test
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium

          eval "$(supabase status -o env)"
          export SUPABASE_URL="$API_URL"
          export SUPABASE_ANON_KEY="$ANON_KEY"
          export SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          export NEXT_PUBLIC_SUPABASE_URL="$API_URL"
          export NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$ANON_KEY"
          export TEST_BASE_URL="http://127.0.0.1:3002"

          cat > /tmp/haddir-delete-account.env <<EOF
          SUPABASE_URL=$API_URL
          SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY
          EOF
          supabase functions serve delete-customer-account --env-file /tmp/haddir-delete-account.env > /tmp/haddir-delete-account-function.log 2>&1 &
          EDGE_FUNCTION_PID=$!

          FUNCTION_READY=0
          for attempt in $(seq 1 60); do
            FUNCTION_STATUS=$(curl --silent --output /dev/null --write-out "%{http_code}" \
              --request POST "http://127.0.0.1:54321/functions/v1/delete-customer-account" \
              --header "apikey: $ANON_KEY" \
              --header "Authorization: Bearer $ANON_KEY" \
              --header "Content-Type: application/json" \
              --data '{}' || true)
            if [ "$FUNCTION_STATUS" = "401" ] || [ "$FUNCTION_STATUS" = "405" ]; then
              FUNCTION_READY=1
              break
            fi
            if ! kill -0 "$EDGE_FUNCTION_PID" 2>/dev/null; then
              cat /tmp/haddir-delete-account-function.log
              exit 1
            fi
            sleep 2
          done

          if [ "$FUNCTION_READY" -ne 1 ]; then
            cat /tmp/haddir-delete-account-function.log
            echo "Local customer deletion Edge Function did not become ready."
            exit 1
          fi

          npm run build

          npm run start -- --hostname 127.0.0.1 --port 3002 > /tmp/haddir-browser-next-start.log 2>&1 &
          NEXT_SERVER_PID=$!
          trap 'status=$?; kill "$NEXT_SERVER_PID" 2>/dev/null || true; kill "$EDGE_FUNCTION_PID" 2>/dev/null || true; if [ "$status" -ne 0 ]; then echo "===== Next.js production browser server log ====="; tail -n 200 /tmp/haddir-browser-next-start.log; echo "===== Local deletion Edge Function log ====="; tail -n 200 /tmp/haddir-delete-account-function.log; fi; exit "$status"' EXIT

          READY=0
          for attempt in $(seq 1 60); do
            HTTP_STATUS=$(curl --silent --output /dev/null --write-out "%{http_code}" \
              "$TEST_BASE_URL" || true)
            if [ "$HTTP_STATUS" = "200" ]; then
              READY=1
              break
            fi
            if ! kill -0 "$NEXT_SERVER_PID" 2>/dev/null; then
              cat /tmp/haddir-browser-next-start.log
              exit 1
            fi
            sleep 2
          done

          if [ "$READY" -ne 1 ]; then
            cat /tmp/haddir-browser-next-start.log
            echo "Next.js production browser test server did not become ready."
            exit 1
          fi

          node --experimental-default-type=module --experimental-strip-types tests/e2e/browser-ui-smoke.mjs
          node --experimental-default-type=module --experimental-strip-types tests/e2e/authenticated-booking-ui.mjs
          node --experimental-default-type=module --experimental-strip-types tests/e2e/admin-payment-review-ui.mjs
          node --experimental-default-type=module --experimental-strip-types tests/e2e/gatekeeper-ticket-checkin-ui.mjs
          node --experimental-default-type=module --experimental-strip-types tests/e2e/advertiser-readonly-ui.mjs
          node --experimental-default-type=module --experimental-strip-types tests/e2e/owner-admin-management-ui.mjs
          node --experimental-default-type=module --experimental-strip-types tests/e2e/auth-session-lifecycle.mjs
          node --experimental-default-type=module --experimental-strip-types tests/e2e/customer-account-deletion-ui.mjs

      - name: Run complete customer booking lifecycle E2E test
        run: |
          eval "$(supabase status -o env)"
          export SUPABASE_URL="$API_URL"
          export SUPABASE_ANON_KEY="$ANON_KEY"
          export SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          export NEXT_PUBLIC_SUPABASE_URL="$API_URL"
          export NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$ANON_KEY"
          export TEST_BASE_URL="http://127.0.0.1:3001"

          npm run dev -- --hostname 127.0.0.1 --port 3001 > /tmp/haddir-e2e-next-dev.log 2>&1 &
          NEXT_SERVER_PID=$!
          trap 'kill "$NEXT_SERVER_PID" 2>/dev/null || true' EXIT

          READY=0
          for attempt in $(seq 1 60); do
            HTTP_STATUS=$(curl --silent --output /dev/null --write-out "%{http_code}" \
              "$TEST_BASE_URL" || true)
            if [ "$HTTP_STATUS" = "200" ]; then
              READY=1
              break
            fi
            if ! kill -0 "$NEXT_SERVER_PID" 2>/dev/null; then
              cat /tmp/haddir-e2e-next-dev.log
              exit 1
            fi
            sleep 2
          done

          if [ "$READY" -ne 1 ]; then
            cat /tmp/haddir-e2e-next-dev.log
            echo "Next.js E2E server did not become ready."
            exit 1
          fi

          npm run test:e2e

      - name: Run concurrent booking inventory test
        run: |
          eval "$(supabase status -o env)"
          export SUPABASE_URL="$API_URL"
          export SUPABASE_ANON_KEY="$ANON_KEY"
          export SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          node tests/integration/booking-concurrency.mjs

      - name: Run concurrent ticket check-in integration test
        run: |
          eval "$(supabase status -o env)"
          export SUPABASE_URL="$API_URL"
          export SUPABASE_ANON_KEY="$ANON_KEY"
          export SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          node tests/integration/ticket-checkin-concurrency.mjs

      - name: Confirm local stack is healthy
        run: supabase status

      - name: Stop local Supabase stack
        if: always()
        run: supabase stop --no-backup
