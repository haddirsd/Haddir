name: Customer account deletion HTTP E2E (local Supabase)

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-supabase-deletion-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.75.0

      - name: Initialize local Supabase configuration when absent
        run: |
          if [ ! -f supabase/config.toml ]; then
            supabase init
          fi
          test -f supabase/config.toml

      - name: Start local Supabase and apply repository migrations
        run: supabase start

      - name: Verify all repository migrations were applied
        shell: bash
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          migration_files="$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | wc -l | tr -d ' ')"
          applied_migrations="$(psql "$DB_URL" -v ON_ERROR_STOP=1 -Atc 'select count(*) from supabase_migrations.schema_migrations')"
          echo "Migration files: $migration_files"
          echo "Applied migrations: $applied_migrations"
          supabase migration list --local
          test "$migration_files" -eq 93
          test "$applied_migrations" -eq "$migration_files"

      - name: Serve delete-customer-account Edge Function locally
        shell: bash
        run: |
          set -euo pipefail
          supabase functions serve delete-customer-account > /tmp/delete-customer-account-function.log 2>&1 &
          echo $! > /tmp/delete-customer-account-function.pid
          for attempt in $(seq 1 60); do
            status="$(curl --silent --output /tmp/delete-customer-account-health.txt --write-out '%{http_code}' http://127.0.0.1:54321/functions/v1/delete-customer-account || true)"
            if [ "$status" = "405" ] || [ "$status" = "401" ]; then
              echo "Edge Function is serving (HTTP $status on readiness probe)."
              exit 0
            fi
            sleep 2
          done
          cat /tmp/delete-customer-account-function.log
          echo "Edge Function did not become ready."
          exit 1

      - name: Diagnose local profiles schema and triggers
        shell: bash
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          echo "=== public.profiles columns ==="
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -P pager=off -c "
            select ordinal_position, column_name, data_type, udt_name, is_nullable, column_default
            from information_schema.columns
            where table_schema = 'public' and table_name = 'profiles'
            order by ordinal_position;"
          echo "=== public.profiles CHECK / UNIQUE / FOREIGN KEY constraints ==="
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -P pager=off -c "
            select c.conname, c.contype, pg_get_constraintdef(c.oid, true) as definition
            from pg_constraint c
            join pg_class r on r.oid = c.conrelid
            join pg_namespace n on n.oid = r.relnamespace
            where n.nspname = 'public' and r.relname = 'profiles'
              and c.contype in ('c', 'u', 'f')
            order by c.contype, c.conname;"
          echo "=== triggers on auth.users and public.profiles ==="
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -P pager=off -c "
            select n.nspname as schema_name, r.relname as table_name,
                   t.tgname as trigger_name, pg_get_triggerdef(t.oid, true) as definition,
                   p.proname as trigger_function
            from pg_trigger t
            join pg_class r on r.oid = t.tgrelid
            join pg_namespace n on n.oid = r.relnamespace
            join pg_proc p on p.oid = t.tgfoid
            where not t.tgisinternal
              and ((n.nspname = 'auth' and r.relname = 'users')
                or (n.nspname = 'public' and r.relname = 'profiles'))
            order by n.nspname, r.relname, t.tgname;"

      - name: Run customer account deletion HTTP E2E harness
        shell: bash
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          SUPABASE_URL="$API_URL" \
          SUPABASE_ANON_KEY="$ANON_KEY" \
          SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" \
            node supabase/recovery/test-harness/customer-account-deletion-http-e2e-v2.mjs

      - name: Show Edge Function logs on failure
        if: failure()
        run: |
          if [ -f /tmp/delete-customer-account-function.log ]; then
            cat /tmp/delete-customer-account-function.log
          fi

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
        continue-on-error: true
