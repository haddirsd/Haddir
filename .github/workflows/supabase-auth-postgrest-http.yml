name: Supabase Auth + RLS + PostgREST HTTP probe

on:
  push:
    branches:
      - test/supabase-auth-postgrest-http
    paths:
      - .github/workflows/supabase-auth-postgrest-http.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  http-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run isolated Supabase HTTP checks
        env:
          SUPABASE_URL: https://adbpeojpscwnsombisif.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_g8_pvfmHtWiEffpuFwme8A_6pnJsk8_
          RUN_ID: ${{ github.run_id }}
        run: |
          node --input-type=module <<'NODE'
          const base = process.env.SUPABASE_URL;
          const key = process.env.SUPABASE_PUBLISHABLE_KEY;
          const checks = [];
          const check = (name, ok, detail = '') => {
            checks.push({ name, ok, detail });
            console.log(`${ok ? 'PASS' : 'FAIL'} ${name}${detail ? ': ' + detail : ''}`);
          };
          const req = async (path, options = {}) => {
            const response = await fetch(base + path, {
              ...options,
              headers: { apikey: key, 'content-type': 'application/json', ...(options.headers || {}) },
            });
            const text = await response.text();
            let body;
            try { body = text ? JSON.parse(text) : null; } catch { body = text; }
            return { response, body };
          };
          try {
            const health = await req('/auth/v1/health');
            check('Auth HTTPS health', health.response.ok, `HTTP ${health.response.status}`);
            if (!health.response.ok) throw new Error('Auth health endpoint unavailable');

            const password = `Haddir-Probe-${process.env.RUN_ID}-Only-91!`;
            const signup = async (suffix) => req('/auth/v1/signup', {
              method: 'POST',
              body: JSON.stringify({ email: `haddir-http-${process.env.RUN_ID}-${suffix}@example.com`, password }),
            });
            const aResult = await signup('a');
            const a = aResult.body;
            check('Email signup HTTP request', aResult.response.ok && !!a?.user?.id, `HTTP ${aResult.response.status}`);
            if (!aResult.response.ok || !a?.user?.id) throw new Error(`Signup failed: ${JSON.stringify(a).slice(0, 250)}`);

            const bResult = await signup('b');
            const b = bResult.body;
            check('Second isolated test signup', bResult.response.ok && !!b?.user?.id, `HTTP ${bResult.response.status}`);

            const aToken = a.access_token || a.session?.access_token;
            const bToken = b?.access_token || b?.session?.access_token;
            check('Auth issues authenticated JWT session', !!aToken, aToken ? 'session issued' : 'signup accepted; email confirmation prevents immediate session');

            const anon = await req('/rest/v1/rls_auth_probe?select=id,owner_id,payload');
            check('Anonymous PostgREST request', anon.response.ok && Array.isArray(anon.body), `HTTP ${anon.response.status}`);
            if (anon.response.ok) check('Anonymous role sees no protected rows', anon.body.length === 0);

            const invalid = await req('/rest/v1/rls_auth_probe?select=id', {
              headers: { Authorization: 'Bearer definitely-not-a-jwt' },
            });
            check('Invalid JWT rejected by PostgREST', [401, 403].includes(invalid.response.status), `HTTP ${invalid.response.status}`);

            if (aToken && bToken) {
              const userReq = (token, method = 'GET', query = '?select=id,owner_id,payload', body) =>
                req('/rest/v1/rls_auth_probe' + query, {
                  method,
                  headers: { Authorization: `Bearer ${token}`, ...(body ? { Prefer: 'return=representation' } : {}) },
                  ...(body ? { body: JSON.stringify(body) } : {}),
                });
              const inserted = await userReq(aToken, 'POST', '', { owner_id: a.user.id, payload: 'http-probe-a' });
              const rows = Array.isArray(inserted.body) ? inserted.body : [];
              check('Authenticated insert own row', inserted.response.ok && rows.length === 1 && rows[0].owner_id === a.user.id, `HTTP ${inserted.response.status}`);
              if (rows.length) {
                const own = await userReq(aToken);
                check('User A reads own row', own.response.ok && own.body.some(x => x.owner_id === a.user.id));
                const crossRead = await userReq(bToken);
                check('User B cannot read User A row', crossRead.response.ok && !crossRead.body.some(x => x.owner_id === a.user.id));
                const crossUpdate = await userReq(bToken, 'PATCH', `?id=eq.${rows[0].id}&select=id`, { payload: 'forbidden' });
                check('User B cannot update User A row', crossUpdate.response.ok && crossUpdate.body.length === 0, `HTTP ${crossUpdate.response.status}`);
                const ownUpdate = await userReq(aToken, 'PATCH', `?id=eq.${rows[0].id}&select=id,payload`, { payload: 'updated' });
                check('User A can update own row', ownUpdate.response.ok && ownUpdate.body.length === 1 && ownUpdate.body[0].payload === 'updated', `HTTP ${ownUpdate.response.status}`);
              }
            } else {
              console.log('SKIP authenticated ownership tests: Auth did not issue a JWT because confirmation may be required.');
            }
          } catch (error) {
            console.error('PROBE ABORTED:', error.message);
            process.exitCode = 1;
          } finally {
            const failed = checks.filter(x => !x.ok);
            console.log(`RESULT: ${checks.length - failed.length}/${checks.length} checks passed; ${failed.length} failed`);
            if (failed.length) process.exitCode = 1;
          }
          NODE
