name: Disposable Supabase Auth and PostgREST HTTP probe
on:
  push:
    branches:
      - test/supabase-auth-postgrest-http
    paths:
      - .github/workflows/supabase-auth-postgrest-http.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Exercise Supabase Auth and PostgREST over real HTTPS
        env:
          SUPABASE_URL: https://adbpeojpscwnsombisif.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_g8_pvfmHtWiEffpuFwme8A_6pnJsk8_
          RUN_ID: ${{ github.run_id }}
        run: |
          node <<'NODE'
          const base = process.env.SUPABASE_URL;
          const key = process.env.SUPABASE_PUBLISHABLE_KEY;
          const email = `haddir-http-${process.env.RUN_ID}@example.com`;
          const password = `Probe-${process.env.RUN_ID}-Only-91!`;
          async function req(path, init = {}) {
            const r = await fetch(base + path, {
              ...init,
              headers: { apikey: key, 'Content-Type': 'application/json', ...(init.headers || {}) }
            });
            const body = await r.text();
            let parsed; try { parsed = JSON.parse(body); } catch {}
            return { status: r.status, body: parsed ?? body };
          }
          (async () => {
            const health = await fetch(base + '/auth/v1/health');
            console.log('AUTH_HEALTH', health.status);
            if (!health.ok) throw new Error('Auth health endpoint failed');
            const signup = await req('/auth/v1/signup', {
              method: 'POST', body: JSON.stringify({ email, password })
            });
            console.log('AUTH_SIGNUP_STATUS', signup.status);
            if (signup.status < 200 || signup.status >= 300) {
              console.log('AUTH_SIGNUP_BODY', JSON.stringify(signup.body).slice(0, 700));
              throw new Error('Auth signup HTTP request failed');
            }
            const accessToken = signup.body?.access_token || signup.body?.session?.access_token;
            console.log('AUTH_SESSION_ISSUED', Boolean(accessToken));
            const anon = await req('/rest/v1/rls_auth_probe?select=id,payload');
            console.log('POSTGREST_ANON_STATUS', anon.status);
            if (![200, 401, 403].includes(anon.status)) throw new Error('Unexpected anon PostgREST status');
            if (accessToken) {
              const own = await req('/rest/v1/rls_auth_probe?select=id,payload', {
                headers: { Authorization: `Bearer ${accessToken}` }
              });
              console.log('POSTGREST_AUTHENTICATED_SELECT_STATUS', own.status);
              if (own.status !== 200) throw new Error('Authenticated PostgREST SELECT failed');
              const inserted = await req('/rest/v1/rls_auth_probe', {
                method: 'POST',
                headers: { Authorization: `Bearer ${accessToken}`, Prefer: 'return=representation' },
                body: JSON.stringify({ owner_id: signup.body.user.id, payload: 'http-probe' })
              });
              console.log('POSTGREST_AUTHENTICATED_INSERT_STATUS', inserted.status);
              if (![200, 201].includes(inserted.status)) throw new Error('Authenticated PostgREST INSERT failed');
            } else {
              console.log('AUTHENTICATED_POSTGREST_SKIPPED', 'Signup requires email confirmation; no session returned');
            }
          })().catch(e => { console.error(e); process.exit(1); });
          NODE
