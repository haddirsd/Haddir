name: Cleanup failed disposable account deletion fixture
on:
  push:
    branches:
      - fix/customer-account-deletion-safety
    paths:
      - ".github/workflows/cleanup-failed-deletion-e2e.yml"
      - "supabase/recovery/test-harness/cleanup-failed-deletion-e2e.cjs"
permissions:
  contents: read
jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://adbpeojpscwnsombisif.supabase.co
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - run: node supabase/recovery/test-harness/cleanup-failed-deletion-e2e.cjs
