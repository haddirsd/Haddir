name: Haddir baseline draft PostgreSQL check

on:
  push:
    branches:
      - chore/restore-supabase-migration-history
    paths:
      - "supabase/recovery/baseline/**"
      - "supabase/recovery/test-harness/**"
      - ".github/workflows/haddir-baseline-draft-check.yml"

permissions:
  contents: read

jobs:
  postgres-ddl-smoke-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: haddir_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d haddir_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: haddir_test
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
      - name: Run isolated PostgreSQL DDL smoke test
        run: python3 supabase/recovery/test-harness/run-baseline-check.py
